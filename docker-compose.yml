services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432" # Порт доступен только с вашего компьютера
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    restart: always

  bot:
    build: ./bot
    depends_on:
      - postgres
      - redis
    env_file: .env
    restart: always
    # Порты не пробрасываем, так как бот будет работать через webhook

  api:
    build: ./api
    depends_on:
      - postgres
    env_file: .env
    restart: always
    ports:
      - "8000:8000" # API будет доступен на порту 8000

volumes:
  pgdata: